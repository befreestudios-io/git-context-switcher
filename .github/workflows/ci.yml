name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same PR makes older runs pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./lcov.info
          fail_ci_if_error: false

  package:
    name: Package contents
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Catch files that are missing from, or leaking into, the published package.
      - name: Check what npm would publish
        run: |
          npm pack --dry-run --json --ignore-scripts > pack.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const [{ files }] = JSON.parse(readFileSync("pack.json", "utf8"));
            const paths = files.map((f) => f.path);
            const allowed = /^(index\.js|package\.json|README\.md|LICENSE|lib\/[\w-]+\.js)$/;
            const unexpected = paths.filter((p) => !allowed.test(p));
            const required = ["index.js", "lib/cli.js", "README.md", "LICENSE"].filter((p) => !paths.includes(p));
            console.log(paths.join("\n"));
            if (unexpected.length) console.log(`::error::Unexpected files in package: ${unexpected.join(", ")}`);
            if (required.length) console.log(`::error::Missing from package: ${required.join(", ")}`);
            if (unexpected.length || required.length) process.exit(1);
          '

  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Version bumps need a changelog entry
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          if git diff "$BASE"...HEAD -- package.json | grep -q '^[+-]  "version"'; then
            VERSION=$(node -p 'require("./package.json").version')
            if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error::package.json is now $VERSION but CHANGELOG.md has no '## [$VERSION]' section"
              exit 1
            fi
          fi
