name: Release

# Release by pushing a version tag:
#   npm version <major|minor|patch> && git push --follow-tags
#
# The package is *staged*, not published: it goes live only after you approve
# it with 2FA (npm stage approve). See RELEASING.md.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN needed
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs a recent npm 11.
      - run: npm install -g npm@11

      - run: npm ci
      - run: npm run check

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          EXPECTED="v$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG doesn't match package.json ($EXPECTED)"
            exit 1
          fi

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v heading="## [${TAG#v}]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [${TAG#v}]' section"
            exit 1
          fi

      - name: Stage on npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Prereleases (v2.1.0-beta.1) go to the "next" dist-tag, not "latest".
          if [[ "$TAG" == *-* ]]; then npm stage publish --tag next; else npm stage publish; fi

      # A draft, so it can't announce a version that isn't live on npm yet.
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          FLAGS=()
          if [[ "$TAG" == *-* ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" --draft --title "$TAG" --notes-file notes.md --verify-tag "${FLAGS[@]}"

      - name: Next steps
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### $TAG is staged, not live yet"
            echo
            echo '1. `npm stage list git-context-switcher` and `npm stage approve <stage-id>` (asks for your 2FA code)'
            echo "2. \`gh release edit $TAG --draft=false\` (or publish the draft on GitHub)"
          } >> "$GITHUB_STEP_SUMMARY"
