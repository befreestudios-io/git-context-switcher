version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels: [dependencies]
    groups:
      # One PR for routine dev-tool bumps instead of one per package.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]

  # Keeps the action versions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies, github-actions]
    groups:
      actions:
        patterns: ["*"]
